<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reflections on a decade in tech</title>
    <meta
      name="description"
      content="Principles and lessons from a decade in tech."
    />
    <meta name="author" content="Andrew Dawson" />
    <meta name="theme-color" content="#faf7f2" />
    <meta property="og:type" content="article" />
    <meta property="og:title" content="Reflections on a decade in tech" />
    <meta
      property="og:description"
      content="Principles and lessons from a decade in tech."
    />

    <!-- Favicon: a serif Roman numeral X — ten years, the decade — on the
         site's terracotta tile, inlined so it needs no extra file or request. -->
    <link
      rel="icon"
      href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%23b0522f"/><text x="32" y="47" font-family="Georgia,serif" font-style="italic" font-size="44" fill="%23faf7f2" text-anchor="middle">X</text></svg>'
    />

    <!-- Font: Newsreader — a warm, upright literary serif used for both the
         display headings and the reading text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Table of contents — floats in the left margin on wide screens -->
    <nav class="toc" id="toc" aria-label="Sections"></nav>

    <main class="page">
      <header class="hero" id="top">
        <h1 class="hero__title" id="hero-title"></h1>
        <p class="hero__subtitle" id="hero-subtitle"></p>
      </header>

      <!-- Right-hand rail: byline, disclaimer + disclosures (floats in the right
           margin on wide screens, sits inline under the hero on narrow ones). -->
      <aside class="rail" id="rail">
        <div class="rail__byline" id="hero-byline"></div>
        <p class="rail__disclaimer" id="hero-disclaimer"></p>
        <div class="disclosures" id="disclosures"></div>
      </aside>

      <!-- Sections (populated by app.js) -->
      <div id="sections"></div>

      <!-- End of essay: asterism + colophon (populated by app.js) -->
      <footer class="footer" id="footer"></footer>
    </main>

    <script src="content.js"></script>
    <script src="app.js"></script>
  </body>
</html>
